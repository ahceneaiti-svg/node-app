# Job de génération de données : insère 20 utilisateurs de test (idempotent).
# Lancer : kubectl apply -f k8s/seed-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-users
  namespace: users-app
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: mysql:8.4
          envFrom:
            - secretRef:
                name: mysql-secret
          command:
            - sh
            - -c
            - |
              until mysqladmin ping -h mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" --silent; do sleep 2; done
              # la table est créée par l'API au démarrage : on la crée aussi au cas où
              mysql -h mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" <<SQL
              CREATE TABLE IF NOT EXISTS users (
                id INT AUTO_INCREMENT PRIMARY KEY,
                name VARCHAR(100) NOT NULL,
                email VARCHAR(255) NOT NULL UNIQUE,
                created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
              );
              SQL
              i=1
              while [ $i -le 20 ]; do
                mysql -h mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" \
                  -e "INSERT IGNORE INTO users (name, email) VALUES ('Utilisateur $i', 'user$i@example.com');"
                i=$((i+1))
              done
              echo "seed terminé"
