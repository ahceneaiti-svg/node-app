# Valeurs de démo pour cluster local. Ne jamais committer de vrais secrets.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: users-app
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: rootpassword
  MYSQL_DATABASE: users_db
  MYSQL_USER: appuser
  MYSQL_PASSWORD: apppassword
  MYSQL_REPLICATION_PASSWORD: replpassword
