apiVersion: apps/v1
kind: Deployment
metadata:
  name: back-node
  namespace: users-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: back-node
  template:
    metadata:
      labels:
        app: back-node
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z mysql 3306; do echo attente mysql; sleep 2; done"]
      containers:
        - name: back-node
          image: ahceneaiti/back-node:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: mysql-secret, key: MYSQL_DATABASE }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: mysql-secret, key: MYSQL_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-secret, key: MYSQL_PASSWORD }
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: back-node
  namespace: users-app
spec:
  type: NodePort
  selector:
    app: back-node
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
